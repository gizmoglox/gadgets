<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>楽天市場へ移動します</title>
<style>
:root { --bg:#f6f6f4; --card:#fff; --text:#1d1d1f; --sub:#6e6e73; --accent:#bf0000; }
@media (prefers-color-scheme: dark) { :root { --bg:#161617; --card:#232325; --text:#f2f2f2; --sub:#a1a1a6; } }
body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif; }
main { max-width:480px; margin:40px auto; padding:24px 16px; background:var(--card); border-radius:12px; }
h1 { font-size:1.1rem; margin:0 0 12px; } p { line-height:1.6; } .sub { color:var(--sub); font-size:.85rem; }
.btn { display:block; text-align:center; padding:14px; margin:12px 0; border-radius:10px; text-decoration:none;
       border:1px solid var(--accent); color:var(--accent); font-weight:bold; }
.btn.primary { background:var(--accent); color:#fff; }
</style></head><body><main>
<p class="sub">PR(楽天アフィリエイト)</p>
<h1>楽天市場のページへ移動します</h1>
<p>【ふるさと納税】 ＼総合1位常連 高リピート率＆衝撃の厚み10mm 厚切り牛タン 塩味／ ≪スピード発送！！30営業日以内発送≫ 選べる内容量 500g / 1kg 定期便 毎月届く 牛肉 肉 BBQ</p>
<p id="hint" class="sub" hidden>アプリ内のブラウザでは楽天にログインしていないことがあります。いつものブラウザで開くと、ログインしたまま買い物できます。</p>
<a id="ext" class="btn primary" hidden>いつものブラウザで開く</a>
<a id="direct" class="btn" rel="sponsored">このまま開く</a>
<noscript><p class="sub">移動するには JavaScript を有効にしてください。</p></noscript>
<p id="count" class="sub" hidden><span id="sec">5</span>秒後に、このまま楽天市場へ移動します</p>
</main>
<script>
var url = atob("aHR0cHM6Ly9oYi5hZmwucmFrdXRlbi5jby5qcC9oZ2MvZzAwdDIzNW8ubDA1dHE5YzIuZzAwdDIzNW8ubDA1dHI1MTAvP3BjPWh0dHBzJTNBJTJGJTJGaXRlbS5yYWt1dGVuLmNvLmpwJTJGZjAzMjA1MS1oYW5hbWFraSUyRjE0MzAxLTMwMDIwODEwJTJGJm09aHR0cCUzQSUyRiUyRm0ucmFrdXRlbi5jby5qcCUyRmYwMzIwNTEtaGFuYW1ha2klMkZpJTJGMTAwMDA4MjclMkYmcmFmY2lkPXdzY19pX2lzXzYzMmYzYmFmLWI2NWUtNDk1Mi1hYjBiLTdlZDNmYjU0YWUzYw=="), ua = navigator.userAgent;
document.getElementById("direct").href = url;
if (!/Instagram|Barcelona|FBAN|FBAV|Twitter|Line\//i.test(ua)) {
  location.replace(url);  // アプリ内ブラウザでなければ待たせない
} else {
  var ext = document.getElementById("ext");
  if (/Android/i.test(ua)) {
    ext.href = "intent://" + url.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url="
      + encodeURIComponent(url) + ";end";
  } else if (/iPhone|iPad|iPod/i.test(ua)) {
    ext.href = "x-safari-" + url;
  }
  if (ext.getAttribute("href")) { ext.hidden = false; document.getElementById("hint").hidden = false; }
  var n = 5, sec = document.getElementById("sec");
  document.getElementById("count").hidden = false;
  var timer = setInterval(function () {
    n -= 1; sec.textContent = n;
    if (n <= 0) { clearInterval(timer); location.href = url; }
  }, 1000);
  ext.addEventListener("click", function () { clearInterval(timer); });
}
</script></body></html>
